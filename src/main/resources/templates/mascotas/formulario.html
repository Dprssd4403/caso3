<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de mascota - VetCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" th:href="@{/mascotas}">
            🐾 VetCare
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="card shadow border-0">
                <div class="card-body p-4">

                    <h2 class="text-success mb-4"
                        th:text="${mascota.id == null}
                            ? 'Registrar mascota'
                            : 'Editar mascota'">
                    </h2>

                    <form th:action="@{/mascotas/guardar}"
                          th:object="${mascota}"
                          method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">
                                Nombre de la mascota
                            </label>

                            <input type="text"
                                   th:field="*{nombre}"
                                   class="form-control"
                                   required>

                            <small class="text-danger"
                                   th:if="${#fields.hasErrors('nombre')}"
                                   th:errors="*{nombre}">
                            </small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Edad</label>

                            <input type="number"
                                   th:field="*{edad}"
                                   min="0"
                                   class="form-control"
                                   required>

                            <small class="text-danger"
                                   th:if="${#fields.hasErrors('edad')}"
                                   th:errors="*{edad}">
                            </small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Raza</label>

                            <input type="text"
                                   th:field="*{raza}"
                                   class="form-control"
                                   required>

                            <small class="text-danger"
                                   th:if="${#fields.hasErrors('raza')}"
                                   th:errors="*{raza}">
                            </small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Especie</label>

                            <select th:field="*{especie.id}"
                                    class="form-select"
                                    required>

                                <option value="">Seleccione una especie</option>

                                <option th:each="especie : ${especies}"
                                        th:value="${especie.id}"
                                        th:text="${especie.nombre}">
                                </option>
                            </select>

                            <small class="text-danger"
                                   th:if="${#fields.hasErrors('especie')}"
                                   th:errors="*{especie}">
                            </small>
                        </div>

                        <div class="d-flex flex-wrap gap-2">

                            <button type="submit"
                                    class="btn btn-success">
                                Guardar mascota
                            </button>

                            <a th:href="@{/mascotas}"
                               class="btn btn-secondary">
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
