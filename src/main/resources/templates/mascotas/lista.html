<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mascotas - VetCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/mascotas}">
            🐾 VetCare
        </a>

        <form th:action="@{/logout}" method="post">
            <button type="submit"
                    class="btn btn-outline-light">
                Cerrar sesión
            </button>
        </form>
    </div>
</nav>

<main class="container py-5">

    <div class="d-flex flex-wrap justify-content-between
                align-items-center gap-3 mb-4">

        <h2 class="text-success mb-0">
            Gestión de mascotas
        </h2>

        <a th:href="@{/mascotas/nueva}"
           class="btn btn-success">
            + Nueva mascota
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">

                    <thead class="table-success">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Edad</th>
                            <th>Raza</th>
                            <th>Especie</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="mascota : ${mascotas}">

                            <td th:text="${mascota.id}"></td>
                            <td th:text="${mascota.nombre}"></td>
                            <td th:text="${mascota.edad}"></td>
                            <td th:text="${mascota.raza}"></td>
                            <td th:text="${mascota.especie.nombre}"></td>

                            <td>
                                <div class="d-flex flex-wrap gap-2">

                                    <a class="btn btn-warning btn-sm"
                                       th:href="@{/mascotas/editar/{id}(id=${mascota.id})}">
                                        Editar
                                    </a>

                                    <form th:action="@{/mascotas/eliminar/{id}(id=${mascota.id})}"
                                          method="post"
                                          onsubmit="return confirm('¿Eliminar esta mascota?')">

                                        <button type="submit"
                                                class="btn btn-danger btn-sm">
                                            Eliminar
                                        </button>

                                    </form>
                                </div>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(mascotas)}">
                            <td colspan="6" class="text-center py-4">
                                No hay mascotas registradas.
                            </td>
                        </tr>
                    </tbody>

                </table>
            </div>

        </div>
    </div>

</main>

</body>
</html>
